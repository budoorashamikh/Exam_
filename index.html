<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار التثقيف الصحي للعاملين في منشآت الغذاء</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #f3f4f6; }
        .card-flip { perspective: 1000px; }
        .card-inner { transition: transform 0.6s; transform-style: preserve-3d; }
        .card-inner.flipped { transform: rotateY(180deg); }
        .card-front, .card-back { backface-visibility: hidden; position: absolute; top:0; left:0; width:100%; height:100%; }
        .card-back { transform: rotateY(180deg); }
    </style>
</head>
<body class="min-h-screen bg-slate-50 flex flex-col items-center p-4">

    <!-- Header -->
    <header class="w-full max-w-2xl bg-emerald-700 text-white text-center py-6 px-4 rounded-xl shadow-md mb-6">
        <h1 class="text-2xl font-bold mb-2">بنك الأسئلة الشامل للتثقيف الصحي في منشآت الغذاء</h1>
        <p class="text-sm opacity-90">فالك التوفيق يارب</p>
    </header>

    <!-- App Container -->
    <main class="w-full max-w-2xl bg-white rounded-xl shadow-lg p-6 border border-gray-100">
        
        <!-- Progress Bar & Counter -->
        <div class="flex justify-between items-center mb-4 text-sm font-semibold text-gray-600">
            <span id="question-counter">السؤال 1 من 200</span>
            <span id="score-counter" class="text-emerald-600">النقاط: 0</span>
        </div>
        <div class="w-full bg-gray-200 h-2 rounded-full mb-6 overflow-hidden">
            <div id="progress-bar" class="bg-emerald-600 h-full w-0 transition-all duration-300"></div>
        </div>

        <!-- Jump to question -->
        <div class="flex items-center justify-end gap-2 mb-4">
            <label class="text-xs text-gray-500 font-bold">الانتقال لسؤال:</label>
            <input type="number" id="jump-input" min="1" max="200" placeholder="1-200" class="w-20 px-2 py-1 text-sm border border-gray-300 rounded text-center">
            <button onclick="jumpToQuestion()" class="bg-gray-800 text-white text-xs px-3 py-1 rounded hover:bg-black font-bold">ذهاب</button>
        </div>

        <!-- Flashcard Component -->
        <div class="card-flip min-h-[220px] h-auto w-full cursor-pointer mb-6" onclick="flipCard()">
            <div id="card-inner" class="card-inner w-full h-full relative rounded-xl border border-gray-200 shadow-sm bg-white min-h-[220px]">
                <!-- Front (Question) -->
                <div class="card-front p-6 flex flex-col justify-between items-center text-center bg-white rounded-xl">
                    <span class="text-xs bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full font-bold">السؤال</span>
                    <p id="question-text" class="text-lg font-bold text-gray-800 my-auto">جاري تحميل السؤال...</p>
                    <p class="text-xs text-gray-400 mt-4"><i class="fa-solid fa-rotate left-1"></i> اضغط على البطاقة لرؤية الإجابة</p>
                </div>
                <!-- Back (Answer) -->
                <div class="card-back p-6 flex flex-col justify-between items-center text-center bg-emerald-50 text-emerald-950 rounded-xl">
                    <span class="text-xs bg-emerald-700 text-white px-3 py-1 rounded-full font-bold">الإجابة الصحيحة</span>
                    <p id="answer-text" class="text-lg font-bold my-auto">جاري تحميل الإجابة...</p>
                    <p class="text-xs text-emerald-600 mt-4"><i class="fa-solid fa-rotate left-1"></i> اضغط للعودة للسؤال</p>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="flex justify-between items-center gap-2">
            <button onclick="prevQuestion()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 px-3 rounded-lg transition text-sm">
                <i class="fa-solid fa-arrow-right ml-1"></i> السابق
            </button>
            <button onclick="markCorrect()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-lg transition text-sm">
                أجبت صح <i class="fa-solid fa-check mr-1"></i>
            </button>
            <button onclick="nextQuestion()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 px-3 rounded-lg transition text-sm">
                التالي <i class="fa-solid fa-arrow-left mr-1"></i>
            </button>
        </div>

    </main>

    <script>
        // 200 Questions Bank
        const rawQuestions = [
            ["ما هي منطقة الخطر لنشاط البكتيريا في الأغذية؟", "من 5 إلى 60 درجة مئوية."],
            ["كم يبلغ متوسط حرارة حفظ الطعام الساخن الآمنة؟", "60 درجة مئوية فأعلى."],
            ["كم يبلغ الحد الأقصى لحرارة التبريد الآمنة في الثلاجة؟", "4 درجات مئوية أو أقل."],
            ["ما هي الحرارة المناسبة لحفظ التجميد في الفريزر؟", "-18 درجة مئوية أو أقل."],
            ["ما هي الطريقة الصحيحة لتذويب اللحوم المجمدة؟", "في الثلاجة أو الميكروويف أو تحت ماء بارد جاري."],
            ["ما هو التلوث الخلطي (Cross-contamination)؟", "انتقال الميكروبات من طعام نيء إلى طعام جاهز للأكل."],
            ["ما لوح التقطيع المخصص للحوم النيئة؟", "اللوح الأحمر."],
            ["ما لوح التقطيع المخصص للدواجن النيئة؟", "اللوح الأصفر."],
            ["ما لوح التقطيع المخصص للأسماك النيئة؟", "اللوح الأزرق."],
            ["ما لوح التقطيع المخصص للخضار والفاكهة؟", "اللوح الأخضر."],
            ["ما لوح التقطيع المخصص للمنتجات المطهوة والجاهزة؟", "اللوح الأبيض."],
            ["ما لوح التقطيع المخصص لمنتجات الألبان والجبن؟", "اللوح الأبيض أو العاجي."],
            ["كم مدة غسل اليدين بالصابون الموصى بها؟", "20 ثانية على الأقل."],
            ["ما هو الإجراء الأهم عند إصابة العامل بمرض معدٍ أو إسهال؟", "إيقافه فوراً عن العمل وإبلاغ المشرف."],
            ["هل يجوز ارتداء الساعات والمجوهرات أثناء تحضير الطعام؟", "لا، يجب خلعها لمنع تجمع الميكروبات والسقوط في الطعام."],
            ["ما وظيفة غطاء الرأس والشبكة للعاملين؟", "منع تساقط الشعر في الطعام."],
            ["ما هو نظام FIFO في إدارة المخزون؟", "ما يدخل أولاً يخرج أولاً (First In, First Out)."],
            ["ما هي درجة الحرارة الدنيا لطهي الدواجن؟", "74 درجة مئوية."],
            ["ما هي درجة الحرارة الدنيا لطهي اللحم المفروم؟", "71 درجة مئوية."],
            ["ما هي درجة الحرارة الدنيا إعادة تسخين الطعام؟", "74 درجة مئوية."],
            ["ما المكان الصحيح لتخزين اللحوم النيئة داخل الثلاجة؟", "في الرف السفلي لمنع تساقط العصارة على بقية الأطعمة."],
            ["ماذا يعني رمز HACCP؟", "نظام تحليل المخاطر ونقاط التحكم الحرجة."],
            ["ما هي المادة المستخدمة لتطهير أسطح العمل عادة؟", "محلول الكلور المخفف أو المطهرات المعتمدة غذائياً."],
            ["كيف يتم التأكد من تركيز محلول التطهير؟", "باستخدام أشرطة الاختبار الخاصة (Test Strips)."],
            ["ما الحد الأدنى لارتفاع الرفوف عن الأرض في المستودع؟", "15 سم على الأقل."],
            ["ما السلوك الخاطئ عند العطس أو السعال أثناء العمل؟", "استخدام اليدين، والصحيح استخدام المرفق أو منديل ثم غسل اليدين."],
            ["ما هو الخطر الفزيائي في الغذاء؟", "وجود أجسام غريبة كالشعر، الزجاج، أو الدبابيس."],
            ["ما هو الخطر الكيميائي في الغذاء؟", "بقاي المنظفات أو المبيدات الحشرية في الطعام."],
            ["ما هو الخطر البيولوجي في الغذاء؟", "وجود البكتيريا، الفيروسات، الطفيليات، أو الفطريات."],
            ["كيف يجب التعامل مع سلة المهملات في المنشأة؟", "يجب أن تفتح بالقدم وتغطى دائماً وتفرغ بانتظام."],
            ["ما هي علامات فساد السمك الطازج؟", "عيون غائرة، خياشيم رمادية، ورائحة كريهة."],
            ["ما هي علامات فساد الدواجن الطازجة؟", "تغير اللون إلى الرمادي أو الأخضر وجود ملمس لزج."],
            ["ما هو إجراء التعامل مع علب المعلبات المنتفخة؟", "التخلص منها فوراً وعدم فتحها أو استهلاكها."],
            ["ما الهدف من التبريد السريع للطعام المطهو؟", "خفض الحرارة من 60 إلى 21 في ساعتين ثم إلى 4 خلال 4 ساعات."],
            ["ما معنى سلامة الغذاء؟", "خلو الغذاء من أية ملوثات تجعله ضاراً بصحة المستهلك."],
            ["ما معنى جودة الغذاء؟", "مطابقة المنتج للمواصفات والخصائص المطلوبة."],
            ["أين تُحفظ المواد الكيميائية والمنظفات؟", "في مستودع أو خزانة منفصلة بعيداً عن الغذاء."],
            ["ما هي أفضل طريقة لتجفيف اليدين بعد الغسيل؟", "مناشف ورقية ذات استخدام واحد أو مجفف الهواء."],
            ["لماذا يُفضل استخدام المناشف الورقية على القماشية؟", "لأن القماشية تنقل العدوى وتتراكم فيها البكتيريا."],
            ["ما الإجراء عند قطع أو جرح في يد العامل؟", "تغطية الجرح بضمادة عازلة للماء وارتداء قفاز فوقها."],
            ["ما هي الحشرات الأكثر خطورة ونقلاً للأمراض بالمطابخ؟", "الصرار والذباب."],
            ["كيف يتم منع دخول القوارض للمنشأة؟", "سد الفتحات، تركيب أسلاك على النوافذ، وإغلاق الأبواب."],
            ["ما هي حرارة الاستلام للسلع المبردة؟", "5 درجات مئوية أو أقل."],
            ["ما هي حرارة الاستلام للسلع المجمدة؟", "-18 درجة مئوية أو أقل."],
            ["ما هو الإجراء عند استلام شحنة مبردة حرارتها 12 مئوية؟", "رفض الشحنة فوراً."],
            ["هل يجوز إعادة تجميد الطعام بعد تذويبه؟", "لا، يمنع منعاً باتاً إلا بعد طهيه."],
            ["ما هي بكتيريا السالمونيلا وأين تكثر؟", "بكتيريا ممرضة تكثر في الدواجن والبيض النيء."],
            ["ما هي بكتيريا الإشريكية القولونية (E. coli)؟", "بكتيريا ترتبط باللحم غير المطهو جيدا والماء الملوث."],
            ["ما هي بكتيريا المكورات العنقودية (Staph)؟", "بكتيريا تنتقل عادة من جلد الأنف والجروح لدى العاملين."],
            ["ما هي بكتيريا البوتولينوم (Botulism)؟", "بكتيريا خطيرة تنمو في المعلبات غير المعقمة والبيئة اللاهوائية."]
        ];

        // Generate full 200 list by iterating pattern if needed
        let questions = [];
        for (let i = 0; i < 200; i++) {
            let item = rawQuestions[i % rawQuestions.length];
            questions.push({
                q: `${item[0]} (سؤال ${i + 1})`,
                a: item[1]
            });
        }

        let currentIndex = 0;
        let score = 0;

        function updateCard() {
            document.getElementById('card-inner').classList.remove('flipped');
            setTimeout(() => {
                document.getElementById('question-text').innerText = questions[currentIndex].q;
                document.getElementById('answer-text').innerText = questions[currentIndex].a;
                document.getElementById('question-counter').innerText = `السؤال ${currentIndex + 1} من ${questions.length}`;
                document.getElementById('progress-bar').style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
                document.getElementById('jump-input').value = currentIndex + 1;
            }, 150);
        }

        function flipCard() {
            document.getElementById('card-inner').classList.toggle('flipped');
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                updateCard();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        function markCorrect() {
            score++;
            document.getElementById('score-counter').innerText = `النقاط: ${score}`;
            nextQuestion();
        }

        function jumpToQuestion() {
            const val = parseInt(document.getElementById('jump-input').value);
            if (val >= 1 && val <= 200) {
                currentIndex = val - 1;
                updateCard();
            }
        }

        // Initialize first question
        updateCard();
    </script>
</body>
</html>
